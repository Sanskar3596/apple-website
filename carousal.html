<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
        }
        #carousal{
           
            position: relative;
            background-color: rgb(254, 254, 254);
            overflow: hidden;
        }
        .box{
            display: flex;
        }
        .box > div{
            background-color: rgb(87, 86, 85);
            width: 100%;
            height: 500px;
            border: 2px solid black;
            flex-shrink: 0;
            
        }
        img{
            /* margin:0px 20px; */
            height: 100%;
            width: 100%;
        }
        .next{
            position: absolute;
            top: 45%;
            right: 0;
            background-color: rgb(5, 5, 5);
            border: 1px solid rgb(252, 252, 252);
            border-radius: 47%; 
            display: flex;
            padding: 5px;
            align-items: center;
        }
        .next,.prev > p {
            color: rgb(255, 254, 254);
            font-weight: bolder;
            margin: 0px;
            font-size: 40px;
        }
        .prev{
            position: absolute;
            top:45%;
            left:0;
            background-color: rgb(0, 0, 0);
            border: 1px solid rgb(252, 252, 252);
            border-radius: 47%; 
            display: flex;
            padding: 5px;
            align-items: center;
        }
        #dot{
            display: flex;
            justify-content: center;
            align-items: center;
            height: 50px;
            width: 100%;
        }
        #dot > p{
            margin: 0px;
            padding: 100px;
            font-size: 80px;
            line-height: 1;
            color : rgb(178, 177, 177);
            
        }
        
    </style>
</head>
<body>
    <div id="carousal">
        <div class="box">
            <div><img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTcWMCKD1u3qG3Ar_29KZYwyzpd8iWKlXoWS1GNevlLlcRjWKhqnH-t3pM&s=10"></div>
            <div><img src="https://image01.realme.net/general/20260608/178089006988598b1ee2154564f5a9b565c86884a86ec.jpg.webp"></div>
            <div><img src="https://image01.realme.net/general/20260721/17846092822796aebc2675aed4877b18502727e008f02.jpg.webp"></div>
        </div>

        <button class="next" type="submit" ><p>&#8594</p></button>
        <button class="prev" type="submit"><p>&#8592</p></button>

        <div id="dot">
            <p>―</p>
            <p>―</p>
            <p>―</p>
        </div>
    </div>
</body>
<script>
    let next = document.querySelector(".next");
    let prev = document.querySelector(".prev");
    let box = document.querySelector(".box");
    let dots = document.querySelectorAll("#dot > p")
    let idx = 0;

    dots[idx].style.color = "black";

    next.addEventListener("click",()=>{
        idx++;
        if(idx==3){
            idx = 0;
        }
        
        box.style.transform = `translateX(-${idx*100}%)`

        dots.forEach((element,i)=>{
            if(i==idx){
                dots[i].style.color = "black";
            }
            else{
                dots[i].style.color = "gray";
            }
        })
        
    })
    prev.addEventListener("click",()=>{
        idx--;
        if(idx<0){
            idx = 2;
        }
        console.log(idx);
        box.style.transform = `translateX(-${idx*100}%)`
    })
</script>
</html>
